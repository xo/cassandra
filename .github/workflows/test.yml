# Tests cassandra on every push and pull request, and every night.
#
# The unit and lint jobs need no server. The integration jobs start each
# server with dbrun from dbmeta, at the pinned commit below, and run the tests
# with CASSANDRA_DSN set to it (D20 in docs/decisions). dbrun is the only thing
# that starts a server.
#
# The release list lives in dbmeta, and this workflow does not repeat it
# (D21). A push tests the releases that dbmeta calls tested. The nightly run
# adds the releases that dbmeta calls nightly. Only the Cassandra and ScyllaDB
# entries are kept.
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # The dbmeta commit whose dbrun starts the servers. It is v0.7.0 of dbmeta, which
  # names the Cassandra dialect cassandra, makes the dsn field of every Cassandra
  # and ScyllaDB release the URL cassandra://, and adds the ordinary role
  # dbmeta_user as the principal with role "user" (dbmeta D102 and D167). A new
  # pin is a commit in this repository (D20).
  DBMETA_COMMIT: abe2ca13cf392e239913b02ea5a8fce22f73279b
  # The owner that dbrun records for each server that this workflow starts, so
  # that it never stops one that another run started (dbmeta D98).
  DBMETA_OWNER: cassandra-ci
  # dbrun uses podman by default, and a GitHub runner has docker.
  DBMETA_RUNNER: docker

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      # -count=2 finds a registration in a test body, which a second run
      # refuses.
      - name: Test
        run: go test -race -count=2 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Pinned, because .golangci.yml sets default: all and a newer release
      # can turn on a linter that nobody chose (D13).
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - name: Lint
        run: golangci-lint run ./...

  releases:
    name: Releases
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: xo/dbmeta
          ref: ${{ env.DBMETA_COMMIT }}
          path: dbmeta
      - uses: actions/setup-go@v7
        with:
          go-version-file: dbmeta/test/go.mod
          # This job checks out only dbmeta, so the cache is keyed on its
          # go.sum.
          cache-dependency-path: dbmeta/test/go.sum
      - name: List
        id: list
        working-directory: dbmeta/test
        run: |
          selectors=tested
          if [ "${{ github.event_name }}" = schedule ]; then
            selectors="tested nightly"
          fi
          names=$(go run ./cmd/dbrun list --json --names $selectors |
            jq -c '[.[] | select(startswith("cassandra-") or startswith("scylla-"))] | unique')
          echo "names=$names" >> "$GITHUB_OUTPUT"

  integration:
    name: ${{ matrix.release }}
    needs: releases
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.releases.outputs.names) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: xo/dbmeta
          ref: ${{ env.DBMETA_COMMIT }}
          path: dbmeta
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Start ${{ matrix.release }}
        working-directory: dbmeta/test
        run: go run ./cmd/dbrun start ${{ matrix.release }}
      - name: Test
        run: |
          # The dsn field is what sql.Open takes, and it holds the scheme cassandra
          # for every release, ScyllaDB too (dbmeta D167). CASSANDRA_DSN is the
          # administrator, and CASSANDRA_ORDINARY_DSN is the ordinary user that
          # dbmeta makes, which dbrun names with the role "user".
          info=$(cd dbmeta/test && go run ./cmd/dbrun dsn --json ${{ matrix.release }})
          export CASSANDRA_DSN=$(echo "$info" | jq -r '.[0].dsn')
          export CASSANDRA_ORDINARY_DSN=$(echo "$info" | jq -r '[.[0].principals[]? | select(.role == "user") | .dsn][0] // empty')
          go test -race -count=1 -run Integration -v ./...
      - name: Logs
        if: failure()
        working-directory: dbmeta/test
        run: go run ./cmd/dbrun logs ${{ matrix.release }}
      - name: Remove ${{ matrix.release }}
        if: always()
        working-directory: dbmeta/test
        run: go run ./cmd/dbrun remove ${{ matrix.release }}
